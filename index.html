<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M5Stick Web Flasher</title>
<script type="module">
import { ESPLoader, Transport } from 'https://unpkg.com/esptool-js@0.5.4/bundle.js';

const firmware = [
  { file: 'bootloader.bin', offset: 0x1000, label: 'Bootloader', id: 'cb-bl' },
  { file: 'partition-table.bin', offset: 0x8000, label: 'Partition table', id: 'cb-pt' },
  { file: 'furi_esp32.bin', offset: 0x10000, label: 'Firmware', id: 'cb-fw' },
];

function getSelectedParts() {
  return firmware.filter(f => document.getElementById(f.id).checked);
}

let transport = null;

const $ = id => document.getElementById(id);
const logEl = $('log');
const btn = $('flash-btn');
const bar = $('progress-bar');

function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function setBtn(text, disabled) {
  btn.textContent = text;
  btn.disabled = disabled;
}

function setProgress(pct) {
  bar.style.width = pct + '%';
}

btn.addEventListener('click', async () => {
  if (transport) {
    await flash();
  } else {
    await connect();
  }
});

async function connect() {
  setBtn('Connecting...', true);
  try {
    const port = await navigator.serial.requestPort();
    transport = new Transport(port, true);
    setBtn('Flash firmware', false);
    log('Connected to device.');
  } catch (e) {
    if (e.name !== 'NotFoundError') log('Error: ' + e.message);
    setBtn('Select device', false);
  }
}

async function flash() {
  setBtn('Flashing...', true);
  setProgress(0);
  log('Starting flash...');

  try {
    const esploader = new ESPLoader({
      transport,
      baudrate: 921600,
      romBaudrate: 115200,
      terminal: {
        clean() {},
        writeLine(data) { log(data); },
        write(data) { log(data); },
      },
    });

    log('Connecting to bootloader...');
    await esploader.main();
    await esploader.flashId();

    const fileArray = [];
    let totalSize = 0;

    const selected = getSelectedParts();
    if (!selected.length) { log('No parts selected.'); setBtn('Flash firmware', false); return; }

    for (const part of selected) {
      log('Loading ' + part.label + '...');
      const resp = await fetch(part.file);
      if (!resp.ok) throw new Error('Failed to load ' + part.file);
      const data = await resp.arrayBuffer();
      const bytes = new Uint8Array(data);
      let str = '';
      for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
      fileArray.push({ data: str, address: part.offset });
      totalSize += bytes.length;
    }

    log('Writing ' + (totalSize / 1024 / 1024).toFixed(1) + ' MB...');

    await esploader.writeFlash({
      fileArray,
      flashSize: '8MB',
      flashMode: 'dio',
      flashFreq: '40m',
      eraseAll: false,
      compress: true,
      reportProgress: (idx, written, total) => {
        setProgress(Math.round((written / total) * 100));
      },
    });

    log('Resetting device...');
    await transport.setDTR(false);
    await transport.setRTS(true);
    await new Promise(r => setTimeout(r, 100));
    await transport.setRTS(false);
    await new Promise(r => setTimeout(r, 100));

    log('Done! Device is rebooting.');
    setProgress(100);
    setBtn('Flash complete', true);
  } catch (e) {
    log('FAILED: ' + e.message);
    console.error(e);
    setBtn('Retry', false);
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #030303;
  color: #e0e0e0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px 16px;
}
.card {
  max-width: 480px;
  width: 100%;
  text-align: center;
}
h1 {
  font-size: 1.8rem;
  color: #ff8c00;
  margin-bottom: 4px;
}
.sub {
  color: #666;
  font-size: 0.85rem;
  margin-bottom: 32px;
}
.parts {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 20px;
  text-align: left;
}
.part-label {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #161616;
  padding: 10px 14px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.9rem;
  color: #ccc;
  transition: 0.15s;
}
.part-label:hover { background: #1e1e1e; }
.part-label input { accent-color: #ff8c00; }
.part-label.select-all {
  background: #111;
  border: 1px solid #333;
  font-weight: 600;
  color: #eee;
}
#flash-btn {
  background: #ff8c00;
  color: #000;
  font-size: 1.1rem;
  font-weight: 600;
  padding: 14px 40px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  width: 100%;
  transition: 0.2s;
  margin-bottom: 20px;
}
#flash-btn:hover:not(:disabled) { background: #ff9f2e; }
#flash-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
.bar-wrap {
  background: #2e2e2e;
  border-radius: 5px;
  height: 20px;
  overflow: hidden;
  margin-bottom: 16px;
}
#progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff8c00, #ffb347);
  transition: width 0.3s;
  border-radius: 5px;
}
@keyframes drift-a {
  0% { transform: translate(0, 0); }
  100% { transform: translate(120vw, -40vh); }
}
@keyframes drift-b {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-80vw, 60vh); }
}
@keyframes drift-c {
  0% { transform: translate(0, 0); }
  100% { transform: translate(60vw, -80vh); }
}
#stars {
  position: fixed;
  inset: 0;
  z-index: -1;
}
.star { position: absolute; background: #fff; border-radius: 50%; }
.star-a { animation: drift-a 200s linear infinite; }
.star-b { animation: drift-b 300s linear infinite; }
.star-c { animation: drift-c 400s linear infinite; }
#log {
  background: #111;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 12px;
  font-family: 'Courier New', monospace;
  font-size: 0.78rem;
  color: #888;
  height: 200px;
  overflow-y: auto;
  text-align: left;
  white-space: pre-wrap;
  word-break: break-all;
}
</style>
</head>
<body>
<div id="stars"></div>
<script>
  const s = document.getElementById('stars');
  const f = document.createDocumentFragment();
  const layers = ['star-a', 'star-b', 'star-c'];
  for (let i = 0; i < 300; i++) {
    const d = document.createElement('div');
    const sz = 0.5 + Math.random() * 2;
    d.className = 'star ' + layers[i % 3];
    d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;opacity:${0.7+Math.random()*0.3}`;
    f.appendChild(d);
  }
  s.appendChild(f);
</script>
<div class="card">
  <h1>M5Stick Flasher</h1>
  <p class="sub">Flipper Zero ESP32 Port</p>
  <div class="parts">
    <label class="part-label select-all"><input type="checkbox" id="cb-all" checked> <span>All</span></label>
    <label class="part-label"><input type="checkbox" id="cb-bl" checked> <span>Bootloader (0x1000)</span></label>
    <label class="part-label"><input type="checkbox" id="cb-pt" checked> <span>Partition table (0x8000)</span></label>
    <label class="part-label"><input type="checkbox" id="cb-fw" checked> <span>Firmware (0x10000)</span></label>
  </div>
  <button id="flash-btn">Select device</button>
  <script>
    document.getElementById('cb-all').addEventListener('change', e => {
      document.querySelectorAll('.parts input').forEach(cb => cb.checked = e.target.checked);
    });
  </script>
  <div class="bar-wrap"><div id="progress-bar"></div></div>
  <div id="log"></div>
</div>
</body>
</html>
